<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TripAddicts — Travel Planning</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('tripaddicts-theme') || localStorage.getItem('wanderease-theme');
          var dark = stored ? stored === 'dark' : true;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
